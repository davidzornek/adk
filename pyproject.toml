[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adk"
version = "0.1.0"
description = "Agent development kit: planner-executor graphs and an LLM eval harness built on LangChain/LangGraph."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "David Zornek" }]
dependencies = [
    "anthropic>=0.122.0",
    "langchain-core",
    "langgraph",
    "langsmith",
    "pydantic>=2",
    "tavily-python>=0.7.27",
    "typing-extensions",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "pre-commit",
]

[tool.hatch.build.targets.wheel]
packages = ["src/llm_utils"]

[tool.ruff]
line-length = 100
target-version = "py311"
# TODO: drop once #7 (base.py) lands; harness.py is permanently unreached scaffolding, excluded for good.
extend-exclude = [
    "src/llm_utils/planner_executor/base.py",
    "src/llm_utils/eval_harness/harness.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
packages = ["llm_utils"]
ignore_missing_imports = true
# TODO: drop once #7 (base.py) lands; harness.py is permanently unreached scaffolding, excluded for good.
exclude = [
    "^src/llm_utils/planner_executor/base\\.py$",
    "^src/llm_utils/eval_harness/harness\\.py$",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
